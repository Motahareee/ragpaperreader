<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>PaperChat</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <h1>PaperChat</h1>
      <div id="status">Starting up...</div>
      <div id="progress-wrap" class="hidden">
        <div id="progress-bar"><div id="progress-fill"></div></div>
      </div>

      <h2>Papers</h2>
      <ul id="paper-list"></ul>

      <h2>Ask a question</h2>
      <div id="chat-log"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Ask about these papers..." disabled autocomplete="off" />
        <button id="chat-send" type="submit" disabled>Ask</button>
      </form>
    </aside>

    <main id="viewer">
      <div id="viewer-toolbar">
        <span id="viewer-title">No paper open</span>
        <div class="spacer"></div>
        <button id="prev-page">&larr;</button>
        <span id="page-indicator"></span>
        <button id="next-page">&rarr;</button>
      </div>
      <div id="canvas-wrap">
        <div id="page-container">
          <canvas id="pdf-canvas"></canvas>
          <div id="highlight-layer"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
