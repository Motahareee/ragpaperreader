<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>PaperChat</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div id="brand">
        <div id="brand-mark">P</div>
        <div id="brand-name">PaperChat</div>
      </div>

      <div id="status-row">
        <div id="status-spinner" class="spinner hidden"></div>
        <div id="status">Starting up&hellip;</div>
      </div>
      <div id="progress-wrap" class="hidden">
        <div id="progress-bar"><div id="progress-fill"></div></div>
      </div>

      <div class="section-label">Papers</div>
      <ul id="paper-list"></ul>

      <details id="compose-panel">
        <summary>Write a related-work section</summary>
        <div id="compose-body">
          <input
            id="compose-topic"
            type="text"
            placeholder="Topic, e.g. 'efficient attention mechanisms'"
            autocomplete="off"
          />
          <button id="compose-generate" type="button" disabled>
            Generate from <span id="compose-count">0</span> selected paper(s)
          </button>
        </div>
      </details>

      <div id="chat-log">
        <div id="empty-state">
          Ask a question about these papers to get started.
        </div>
      </div>

      <form id="chat-form">
        <textarea
          id="chat-input"
          rows="1"
          placeholder="Ask about these papers..."
          disabled
          autocomplete="off"
        ></textarea>
        <button id="chat-send" type="submit" disabled aria-label="Send">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </form>
    </aside>

    <main id="viewer">
      <div id="viewer-toolbar">
        <span id="viewer-title">No paper open</span>
        <div class="spacer"></div>
        <button id="zoom-out" class="icon-btn" aria-label="Zoom out" disabled>&minus;</button>
        <span id="zoom-indicator">100%</span>
        <button id="zoom-in" class="icon-btn" aria-label="Zoom in" disabled>+</button>
        <span class="toolbar-divider"></span>
        <button id="prev-page" class="icon-btn" aria-label="Previous page" disabled>&larr;</button>
        <span id="page-indicator"></span>
        <button id="next-page" class="icon-btn" aria-label="Next page" disabled>&rarr;</button>
      </div>
      <div id="canvas-wrap">
        <div id="viewer-empty">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"></path>
            <path d="M15 2v5h5"></path>
          </svg>
          <div>Select a paper or click a citation to view it here</div>
        </div>
        <div id="page-container" class="hidden">
          <canvas id="pdf-canvas"></canvas>
          <div id="highlight-layer"></div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
